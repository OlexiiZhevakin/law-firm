<svg viewBox="0 0 320 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&amp;family=Playfair+Display:wght@600&amp;display=swap');
      .brand-name { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 600; letter-spacing: 0.15em; fill: currentColor; }
      .descriptor { font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 500; letter-spacing: 0.4em; text-transform: uppercase; fill: currentColor; opacity: 0.6; }
    </style>
  </defs>
  
  <!-- Monogram -->
  <g transform="translate(0, 6) scale(0.48)">
    <line x1="25" y1="35" x2="25" y2="80" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
    <line x1="50" y1="20" x2="50" y2="80" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
    <line x1="75" y1="20" x2="75" y2="65" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
    <line x1="25" y1="57.5" x2="50" y2="57.5" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
    <line x1="50" y1="42.5" x2="75" y2="42.5" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
    <rect x="44" y="51.5" width="12" height="12" fill="currentColor" />
    <rect x="44" y="36.5" width="12" height="12" fill="currentColor" />
    <rect x="19" y="51.5" width="12" height="12" fill="currentColor" />
    <rect x="69" y="36.5" width="12" height="12" fill="currentColor" />
  </g>
  
  <!-- Typography -->
  <g transform="translate(70, 34)">
    <text x="0" y="0" class="brand-name">HARLIB</text>
    <text x="2" y="16" class="descriptor">FINANCIAL LAW BOUTIQUE</text>
  </g>
</svg>